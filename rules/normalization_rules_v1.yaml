version: v1.0

başlık: NORMALİZASYON KURALLARI
açıklama: >
  AI Call Center Projesi kapsamında geliştirilen konuşma tanıma (ASR) ve
  sentezleme (TTS) sistemlerinin tutarlı biçimde değerlendirilebilmesi
  için, transkript ve konuşma verilerinde kullanılacak ortak bir yazım
  standardına ihtiyaç duyulmaktadır. Bu standart; rakam, tarih, saat,
  para birimi, kısaltma ve noktalama unsurlarının nasıl yazılacağını
  belirleyerek, farklı model ve sistemler arasında yapılan ölçümlerin
  karşılaştırılabilir ve tekrarlanabilir olmasını sağlar.

kurallar:

  - id: 1
    başlık: Rakamlar
    kural: >
      Tek haneli sayılar bağlama göre yazılır: miktar/sayaç anlamındaysa
      rakamla, doğal konuşma dolgusuysa yazıyladır. Sıra bildiren
      sayılar rakam + nokta formatında yazılır. Çok haneli sayılar
      (TCKN, IBAN, sipariş no, telefon) standart gruplu/bitişik
      formatla, konuşulduğu gibi değil, hedef normalize formla yazılır.
      Sıra sayıları ve yüzdeler de kendi kurallarına göre normalize
      edilir.
    örnekler:
      - girdi: "üç kere aradım"
        çıktı: "3 kere aradım"
      - girdi: "bir saniye bakayım"
        çıktı: "bir saniye bakayım"
        not: dolgu, rakama çevrilmez
      - girdi: "bir iki üç dört beş... (TCKN okunuşu)"
        çıktı: "12345678901"
        not: bitişik, 11 hane
      - girdi: "üçüncü kez arıyorum"
        çıktı: "3. kez arıyorum"
        not: sıra sayısı, nokta ile
      - girdi: "yüzde on indirim"
        çıktı: "%10 indirim"
    gerekçe: >
      expected_entities.value_normalized alanı normalize form beklediği
      için tutarlı bir rakam/yazı ayrımı olmadan entity F1 karşılaştırması
      sağlıklı yapılamaz.
    istisna: >
      Telefon numaraları TCKN'den farklı gruplanabilir (ör. 0XXX XXX XX XX).

  - id: 2
    başlık: Tarih
    kural: >
      Sabit tarihler GG.AA.YYYY formatına normalize edilir. Göreli tarih
      ifadeleri ("yarın", "geçen hafta") olduğu gibi bırakılır, normalize
      edilmez. Gün adı geçen ifadelerde gün adı korunur, tarihe çevrilmez.
    örnekler:
      - girdi: "3 Ağustos 2026'da"
        çıktı: "03.08.2026'da"
      - girdi: "yarın arayacağım"
        çıktı: "yarın arayacağım"
        not: değişmez
      - girdi: "geçen salı görüşmüştük"
        çıktı: "geçen salı görüşmüştük"
        not: değişmez, gün adı tarihe çevrilmez
    gerekçe: >
      Göreli tarihi normalize etmek çağrı zaman damgasına bağımlı ek bilgi
      ister; kapsamı gereksiz büyütür ve WER üzerindeki etkisi düşük.
    istisna: >
      Yıl belirtilmeyen tarihler ("3 Ağustos'ta") için yıl varsayımı
      yapılmaz, olduğu gibi bırakılır.

  - id: 3
    başlık: Saat
    kural: >
      24 saatlik format (SS:DD) kullanılır. "Buçuk", "çeyrek geçe/kala"
      gibi açık saat ifadeleri saat:dakika formatına çevrilir. Sözel
      veya göreli zaman ifadeleri ("öğlen", "akşam", "gece yarısı",
      "sabah", "öğleden sonra") normalize edilmez ve olduğu gibi
      bırakılır.
    örnekler:
      - girdi: "saat üçte"
        çıktı: "03:00"
      - girdi: "saat üç buçukta"
        çıktı: "03:30"
      - girdi: "dörde çeyrek kala"
        çıktı: "03:45"
    gerekçe: >
      Sayısal karşılaştırmayı basitleştirir; ASR ve TTS tarafında aynı
      normalize formu kullanmak, farklı sistemler arasında yapılan
      ölçümlerin karşılaştırılabilir olmasını sağlar.
    istisna: >
      Belirsiz saat ifadeleri ("öğleden sonra bir ara") normalize
      edilmez, olduğu gibi bırakılır.

  - id: 4
    başlık: Para Birimi
    kural: >
      Tutarlar rakam + ondalık virgül + birim formatında yazılır:
      [tutar],[kuruş] TL. Kuruş belirtilmeyen tutarlarda ondalık kısım
      ",00" olarak tamamlanır. İade/negatif tutarlar eksi işaretiyle
      belirtilir.
    örnekler:
      - girdi: "bin iki yüz elli lira elli kuruş"
        çıktı: "1.250,50 TL"
      - girdi: "yüz lira"
        çıktı: "100,00 TL"
      - girdi: "eksi iki yüz lira iade"
        çıktı: "-200,00 TL iade"
    gerekçe: >
      TR yazım standardıyla (virgül ondalık ayracı) tutarlıdır; TTS
      öncesinde yapılacak ters normalizasyon süreci de aynı formatı
      kullanacaktır.
    istisna: >
      Yabancı para birimi (USD, EUR) geçerse birim kısaltması korunur,
      TL'ye çevrilmez.

  - id: 5
    başlık: Kısaltmalar
    kural: >
      Yaygın kısaltmalar (TL, IBAN, TCKN) açılmadan kısaltma olarak
      yazılır. TTS'in bunları nasıl okuyacağı ("TL" → "tea el" mi "lira"
      mı) bu dokümanın kapsamı dışında, ayrı bir alt karar konusudur.
      Kısaltmalar açılmadan aynı kısaltma biçiminde yazılır, ancak WER
      hesaplamasında büyük/küçük harf farkının etkisini önlemek için
      tüm transkript gibi küçük harfle yazılır.
    örnekler:
      - girdi: "IBAN numaram şu"
        çıktı: "iban numaram şu"
      - girdi: "1250 TL"
        çıktı: "1.250,00 TL"
      - girdi: "KDV"
        çıktı: "kdv"
    gerekçe: >
      Transkript okunabilirliği için kısaltma açılmadan bırakmak daha
      doğaldır; açma işlemi TTS-öncesi ayrı bir normalizasyon katmanının
      sorumluluğudur.
    istisna: >
      Kurum/ürün adına özgü kısaltmalar için ayrı bir sözlük gerekebilir;
      bu, hotword sözlüğüyle birleştirilebilir.

  - id: 6
    başlık: Noktalama
    kural: >
      Transkriptte noktalama işareti kullanılmaz (WER hesaplamasından
      çıkarılır). Ancak entity pozisyonları (position alanı) noktalamadan
      bağımsız, karakter/kelime indeksine göre korunur.
    örnekler:
      - girdi: "Merhaba, nasılsınız?"
        çıktı: "merhaba nasılsınız"
      - girdi: "Tamam! Hemen bakıyorum."
        çıktı: "tamam hemen bakıyorum"
    gerekçe: >
      Open ASR Leaderboard ve çoğu ASR benchmark'ı noktalamasız ölçüyor;
      bu, farklı modellerin noktalama tarzı farkından kaynaklanan yapay
      WER farkını önler.
    istisna: "Yok — bu kural istisnasız uygulanır."

  - id: 7
    başlık: Büyük/Küçük Harf
    kural: >
      Tüm normalize edilmiş transkript küçük harfle yazılır; özel
      isimler dahil hiçbir istisna yoktur. Kısaltmalar da bu kurala
      tabidir.
    örnekler:
      - girdi: "Ahmet Bey aradı"
        çıktı: "ahmet bey aradı"
      - girdi: "İstanbul'dan arıyorum"
        çıktı: "istanbul'dan arıyorum"
    gerekçe: >
      WER hesaplamasında büyük/küçük harf farkının modelin gerçek
      performansını yansıtmayan yapay hatalara yol açmasını önler;
      farklı ASR çıktılarının tutarlı karşılaştırılmasını sağlar.
    istisna: "Yok — bu kural istisnasız uygulanır."
